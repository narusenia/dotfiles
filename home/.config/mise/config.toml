[settings]
# The only place the repo path is written; group roots are relative to it.
dotfiles.root = "~/ghq/github.com/NaruseNia/dotfiles"

# ---------------------------------------------------------------------------
# Dotfiles: every file under home/ is symlinked to the same path under ~.
# `mise dot add <file>` saves a new file into home/ as part of this group.
# ---------------------------------------------------------------------------
[dotfile_groups.home]
root = "home"
target = "~"
mode = "symlink-each"
exclude = [".DS_Store"]

# ---------------------------------------------------------------------------
# Tools
# ---------------------------------------------------------------------------
[tools]
# runtimes
bun = "latest"
deno = "latest"
go = "1.21"
java = "latest"
node = "24"
pnpm = "latest"
python = "latest"
rust = "latest"
yarn = "latest"
zig = "0.16"

# CLI (prebuilt binaries via aqua so they also work on Windows)
"aqua:BurntSushi/ripgrep" = "latest"
"aqua:ajeetdsouza/zoxide" = "latest"
"aqua:charmbracelet/gum" = "latest"
"aqua:cli/cli" = "latest"
"aqua:dandavison/delta" = "latest"
"aqua:jesseduffield/lazydocker" = "latest"
"aqua:jesseduffield/lazygit" = "latest"
"aqua:jqlang/jq" = "latest"
"aqua:junegunn/fzf" = "latest"
"aqua:mozilla/sccache" = "latest"
"aqua:muesli/duf" = "latest"
"aqua:neovim/neovim" = "latest"
"aqua:sharkdp/bat" = "latest"
"aqua:sharkdp/fd" = "latest"
"aqua:x-motemen/ghq" = "latest"
"aqua:zellij-org/zellij" = { version = "latest", os = ["linux", "macos"] }
"github:herdrdev/herdr" = { version = "latest", os = ["linux", "macos"] }
"github:padovanl/portop" = { version = "latest", os = ["linux", "macos"] }
"github:trasta298/keifu" = "latest"
"github:yt-dlp/yt-dlp" = "latest"

# cargo / npm
"cargo:kache" = "2.3.0"
"npm:@antfu/ni" = "latest"
"npm:@marp-team/marp-cli" = "latest"
"npm:takt" = "latest"

# ---------------------------------------------------------------------------
# Global tasks: `mise run <name>` from any directory (`mise tasks` lists them)
# The repo path is read from dotfiles.root, so it is written only once above.
# ---------------------------------------------------------------------------
[tasks."dot:status"]
description = "Show uncommitted dotfile changes and link status"
run = '''
D=$(mise settings get dotfiles.root); D="${D/#\~/$HOME}"
git -C "$D" status --short --branch
mise dot status
'''

[tasks."dot:sync"]
description = "Pull the dotfiles repo, relink, and install new tools"
run = '''
D=$(mise settings get dotfiles.root); D="${D/#\~/$HOME}"
git -C "$D" pull --rebase --autostash
mise dot apply --yes
mise install --yes
'''

[tasks."dot:save"]
description = "Commit every dotfile change and push (usage: mise run dot:save 'message')"
usage = 'arg "<message>" help="commit message"'
run = '''
D=$(mise settings get dotfiles.root); D="${D/#\~/$HOME}"
git -C "$D" add -A
git -C "$D" commit -m "$usage_message"
git -C "$D" push
'''

[tasks."dot:add"]
description = "Start managing a file (usage: mise run dot:add ~/.config/foo/bar.toml)"
usage = 'arg "<path>" help="file under ~ to move into the repo"'
run = 'mise dot add "$usage_path"'

[tasks."dot:edit"]
description = "Open the dotfiles repo in $EDITOR"
run = '''
D=$(mise settings get dotfiles.root); D="${D/#\~/$HOME}"
cd "$D" && ${EDITOR:-nvim} .
'''

[tasks."brew:check"]
description = "Show brew packages installed but missing from the Brewfile"
run = '''
D=$(mise settings get dotfiles.root); D="${D/#\~/$HOME}"
brew bundle cleanup --file "$D/Brewfile" || true  # exits 1 when it finds extras
'''

[tasks."tools:up"]
description = "Upgrade mise tools and drop versions no config uses"
run = '''
mise upgrade
mise prune --yes
'''

[tasks.clean]
description = "Free disk space: old brew/mise versions and package caches"
run = '''
df -h / | tail -1
command -v brew >/dev/null && brew cleanup -s
mise prune --yes
mise cache clear
command -v npm  >/dev/null && npm cache clean --force
command -v pnpm >/dev/null && pnpm store prune
command -v uv   >/dev/null && uv cache clean
df -h / | tail -1
'''
